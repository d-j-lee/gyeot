# 곁(gyeot) CI — 이 컨테이너(Linux)에서 돌려 보지 못한 것(Windows 빌드·Tauri 셸·PowerShell 설치)을 여기서 확인한다.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short
  NODE_VERSION: "22"

jobs:
  # ───────────── Rust 워크스페이스(코어·서버·데몬·훅 심) ─────────────
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --no-fail-fast
      - name: gyeot-core wasm 빌드 확인
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p gyeot-core --target wasm32-unknown-unknown

  # ───────────── 얼굴(face) ─────────────
  face:
    name: face
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: face
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: npm-cache
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: npm-${{ runner.os }}-face-${{ hashFiles('face/package-lock.json', 'face/package.json') }}
          restore-keys: npm-${{ runner.os }}-face-
      - name: 의존성 설치
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # ───────────── channel(MCP 서버) ─────────────
  channel:
    name: channel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: channel
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: npm-cache
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: npm-${{ runner.os }}-channel-${{ hashFiles('channel/package-lock.json', 'channel/package.json') }}
          restore-keys: npm-${{ runner.os }}-channel-
      - name: 의존성 설치
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # ───────────── 끝-끝 실측: 실제 데몬·훅 심·channel·얼굴(Chrome)을 잇는다 ─────────────
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 빌드(데몬·훅 심)
        run: cargo build --workspace
      - name: 빌드(얼굴)
        working-directory: face
        run: npm ci --no-audit --no-fund && npm run build
      - name: 빌드(channel)
        working-directory: channel
        run: npm ci --no-audit --no-fund && npm run build
      - name: 끝-끝 실측
        run: node tests/e2e/e2e.mjs --screenshots e2e-shots
      - name: 실측 화면 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots-${{ matrix.os }}
          path: e2e-shots
          if-no-files-found: ignore

  # ───────────── Tauri 셸: 포맷·린트·단위 시험(ACL 시험 포함) ─────────────
  shell:
    name: shell (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: shell/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri -> target
          key: shell-debug
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked

  # ───────────── 설치 스크립트: 구문·린트·가짜 파일로 설치/지우기 시험(5.1·7) ─────────────
  scripts:
    name: scripts (PowerShell 5.1 · 7)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: UTF-8 BOM 확인(Windows PowerShell 5.1이 한글을 읽으려면 필요)
        shell: pwsh
        run: |
          $bad = @()
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            $b = [IO.File]::ReadAllBytes($f.FullName)
            if (-not ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) { $bad += $f.Name }
          }
          if ($bad) { Write-Error "BOM 없음: $($bad -join ', ')"; exit 1 }
      - name: 구문 확인(Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $failed = $true; $errs | ForEach-Object { Write-Host "$($f.Name):$($_.Extent.StartLineNumber): $($_.Message)" } }
          }
          if ($failed) { exit 1 }
          $PSVersionTable.PSVersion
      - name: 구문 확인(PowerShell 7)
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $failed = $true; $errs | ForEach-Object { Write-Host "$($f.Name):$($_.Extent.StartLineNumber): $($_.Message)" } }
          }
          if ($failed) { exit 1 }
          $PSVersionTable.PSVersion
      - name: PSScriptAnalyzer(오류는 실패, 경고는 표시만)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          }
          $all = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning, Error `
            -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions
          $all | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 220 | Write-Host
          if (@($all | Where-Object Severity -eq 'Error').Count -gt 0) { exit 1 }
      - name: 가짜 배포 폴더 만들기
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP 'gyeot-fake'
          New-Item -ItemType Directory -Force -Path "$fake\bin", "$fake\face\assets" | Out-Null
          Set-Content "$fake\bin\gyeotd.exe" 'fake'
          Set-Content "$fake\bin\gyeot-hook.exe" 'fake'
          Set-Content "$fake\bin\gyeot-channel.mjs" '// fake'
          Set-Content "$fake\face\index.html" '<!doctype html>'
          Set-Content "$fake\face\assets\app.js" '// fake'
          Copy-Item examples "$fake\examples" -Recurse
          "GYEOT_FAKE=$fake" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: 설치·지우기 자체 시험(Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\test-install.ps1 -SourceDir $env:GYEOT_FAKE -SkipInit
      - name: 설치·지우기 자체 시험(PowerShell 7)
        shell: pwsh
        run: ./scripts/test-install.ps1 -SourceDir $env:GYEOT_FAKE -SkipInit
      - name: 부트스트랩·점검 함수 시험(Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\test-bootstrap.ps1
      - name: 부트스트랩·점검 함수 시험(PowerShell 7)
        shell: pwsh
        run: ./scripts/test-bootstrap.ps1

  # ───────────── Windows 배포본: 릴리스 빌드 → 설치 스크립트 검증 → zip·설치본 ─────────────
  windows-dist:
    name: windows dist
    needs: [rust, face, channel, e2e, shell, scripts]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            shell/src-tauri -> target
          key: dist-release
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: npm-cache
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: npm-${{ runner.os }}-dist-${{ hashFiles('face/package-lock.json', 'channel/package-lock.json', 'shell/package-lock.json', 'face/package.json', 'channel/package.json', 'shell/package.json') }}
          restore-keys: npm-${{ runner.os }}-dist-

      - name: 데몬·훅 심 릴리스 빌드
        shell: pwsh
        run: |
          cargo build --release --workspace --bins
          foreach ($exe in 'gyeotd.exe', 'gyeot-hook.exe') {
            if (-not (Test-Path "target\release\$exe")) { Write-Error "target\release\$exe 가 없어요"; exit 1 }
          }

      - name: 얼굴(face) 빌드
        shell: bash
        working-directory: face
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm run build
          test -f dist/index.html

      - name: channel 번들
        shell: bash
        working-directory: channel
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm run build
          test -f dist/gyeot-channel.mjs

      - name: 셸(Tauri) 빌드 — 실행 파일과 NSIS 설치본
        shell: bash
        working-directory: shell
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx tauri build --bundles nsis --ci
          ls -la src-tauri/target/release/bundle/nsis/

      - name: 배포 폴더 만들기
        shell: pwsh
        run: |
          $stage = 'dist\gyeot-windows-x64'
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$stage\bin", "$stage\face", "$stage\scripts", "$stage\examples" | Out-Null
          Copy-Item target\release\gyeotd.exe, target\release\gyeot-hook.exe "$stage\bin\"
          Copy-Item shell\src-tauri\target\release\gyeot-shell.exe "$stage\bin\"
          Copy-Item channel\dist\gyeot-channel.mjs "$stage\bin\"
          Copy-Item face\dist\* "$stage\face\" -Recurse
          Copy-Item scripts\install.ps1, scripts\uninstall.ps1, scripts\gyeot-common.ps1, scripts\doctor.ps1, scripts\bootstrap.ps1 "$stage\scripts\"
          Copy-Item examples\* "$stage\examples\" -Recurse
          if (Test-Path README.md) { Copy-Item README.md "$stage\README.md" } else { Copy-Item shell\README.md "$stage\README.md" }
          Copy-Item shell\README.md "$stage\README-shell.md"
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          @(
            "곁(gyeot) Windows x64",
            "version: $ver",
            "ref:    $env:GITHUB_REF_NAME",
            "commit: $env:GITHUB_SHA",
            "built:  $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))",
            "run:    $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content -Encoding utf8 "$stage\BUILD.txt"
          $setup = @(Get-ChildItem shell\src-tauri\target\release\bundle\nsis -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { Write-Error "NSIS 설치본을 하나 찾지 못했어요: $($setup.Name -join ', ')"; exit 1 }
          Copy-Item $setup[0].FullName dist\gyeot-shell-setup-x64.exe
          Get-ChildItem $stage -Recurse -File | Select-Object -ExpandProperty FullName

      - name: install.ps1 -DryRun (Windows PowerShell 5.1)
        shell: powershell
        run: .\dist\gyeot-windows-x64\scripts\install.ps1 -DryRun -ApplyClaudeHooks -RegisterStartup -InstallRoot "$env:RUNNER_TEMP\gyeot-dry"

      - name: install.ps1 -DryRun (PowerShell 7)
        shell: pwsh
        run: ./dist/gyeot-windows-x64/scripts/install.ps1 -DryRun -ApplyClaudeHooks -RegisterStartup -InstallRoot "$env:RUNNER_TEMP\gyeot-dry"

      - name: 설치·지우기 자체 시험, 실제 gyeotd --init 포함(Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\test-install.ps1 -SourceDir .\dist\gyeot-windows-x64 -WithStartup

      - name: 설치·지우기 자체 시험, 실제 gyeotd --init 포함(PowerShell 7)
        shell: pwsh
        run: ./scripts/test-install.ps1 -SourceDir ./dist/gyeot-windows-x64

      - name: zip 만들기
        shell: pwsh
        run: |
          Compress-Archive -Path dist\gyeot-windows-x64\* -DestinationPath dist\gyeot-windows-x64.zip -Force
          Get-FileHash dist\gyeot-windows-x64.zip, dist\gyeot-shell-setup-x64.exe -Algorithm SHA256 | Format-List

      - name: 이 zip 으로 bootstrap 끝-끝(설치·데몬·doctor·업데이트·지우기, Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\test-bootstrap.ps1 -ZipPath .\dist\gyeot-windows-x64.zip

      - name: 이 zip 으로 bootstrap 끝-끝(PowerShell 7)
        shell: pwsh
        run: ./scripts/test-bootstrap.ps1 -ZipPath ./dist/gyeot-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gyeot-windows-x64
          path: dist/gyeot-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: gyeot-shell-setup-x64
          path: dist/gyeot-shell-setup-x64.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: gyeot-shell-exe
          path: shell/src-tauri/target/release/gyeot-shell.exe
          if-no-files-found: error
          retention-days: 14

  # ───────────── 릴리스: v* 태그일 때만, 같은 실행의 windows dist 산출물을 그대로 올린다 ─────────────
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-dist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - name: 태그와 판이 같은지(vX.Y.Z, 또는 미리 내는 vX.Y.Z-rc.N)
        id: ver
        run: |
          v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          case "$GITHUB_REF_NAME" in
            "v$v") echo "pre=false" >> "$GITHUB_OUTPUT" ;;
            "v$v"-rc.[0-9]*) echo "pre=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "태그 $GITHUB_REF_NAME 와 Cargo.toml 판 $v 가 맞지 않아요(v$v 또는 v$v-rc.N)"; exit 1 ;;
          esac
          echo "base=v$v" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: gyeot-windows-x64
          path: rel
      - uses: actions/download-artifact@v4
        with:
          name: gyeot-shell-setup-x64
          path: rel
      - name: 자산 모으기·해시
        run: |
          cp scripts/bootstrap.ps1 INSTALL-WITH-CLAUDE.md rel/
          cd rel
          sha256sum gyeot-windows-x64.zip gyeot-shell-setup-x64.exe bootstrap.ps1 INSTALL-WITH-CLAUDE.md > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la
      - name: 출처 증명 만들기(이 저장소의 Actions 가 만든 파일임을 서명)
        uses: actions/attest@v4
        with:
          subject-path: |
            rel/gyeot-windows-x64.zip
            rel/gyeot-shell-setup-x64.exe
            rel/bootstrap.ps1
            rel/INSTALL-WITH-CLAUDE.md
      - name: 출처 증명 확인(gh attestation verify)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in gyeot-windows-x64.zip gyeot-shell-setup-x64.exe bootstrap.ps1 INSTALL-WITH-CLAUDE.md; do
            gh attestation verify "rel/$f" --repo "$GITHUB_REPOSITORY"
          done
      - name: 릴리스 노트(CHANGELOG 의 이 판)
        env:
          BASE: ${{ steps.ver.outputs.base }}
        run: |
          awk -v tag="## $BASE" '($0 == tag || index($0, tag " ") == 1) {f=1; next} /^## /{if(f) exit} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md 에 '## $BASE' 절이 없어요"; exit 1; }
          cat notes.md
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          PRE: ${{ steps.ver.outputs.pre }}
        run: |
          flags=()
          if [ "$PRE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" rel/gyeot-windows-x64.zip rel/gyeot-shell-setup-x64.exe rel/bootstrap.ps1 rel/INSTALL-WITH-CLAUDE.md rel/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "곁 $GITHUB_REF_NAME" --notes-file notes.md --verify-tag "${flags[@]}"

  # 올린 릴리스를 사람이 받는 길 그대로 받아 Windows 에 설치·업데이트·점검·지우기까지 해 본다.
  # 5.1 은 gh 로그인 없이 HTTPS 로(처음 설치), 7 은 gh 로그인으로(출처 증명 확인, 같은 폴더 위 업데이트).
  # bootstrap 은 Write-Host 로 쓰므로 같은 프로세스에서 부를 때 6>&1 로 받아야 출력 검사가 된다.
  release-check:
    name: release-check (Windows, 받은 릴리스로)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: bootstrap.ps1 받기·무결성(HTTPS, 인증 없음)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $d = Join-Path $env:RUNNER_TEMP 'gyeot-boot'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          $ProgressPreference = 'SilentlyContinue'
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME"
          foreach ($f in @('bootstrap.ps1', 'SHA256SUMS.txt', 'INSTALL-WITH-CLAUDE.md')) { Invoke-WebRequest -UseBasicParsing -Uri "$base/$f" -OutFile (Join-Path $d $f) }
          foreach ($f in @('bootstrap.ps1', 'INSTALL-WITH-CLAUDE.md')) {
            $want = ((Select-String -Path (Join-Path $d 'SHA256SUMS.txt') -Pattern "  $([regex]::Escape($f))$").Line -split '\s+')[0]
            $got = (Get-FileHash -Algorithm SHA256 (Join-Path $d $f)).Hash.ToLowerInvariant()
            if ($got -ne $want) { throw "$f 해시가 맞지 않아요($got / $want)" }
            Write-Host "$f 해시 일치"
          }
      - name: 미리보기(5.1, HTTPS) — 아무것도 바꾸지 않는다
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP\gyeot-boot\bootstrap.ps1" -Tag $env:GITHUB_REF_NAME -ApplyClaudeHooks -RegisterStartup 6>&1 | Tee-Object -Variable out | Out-Host
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (($out | Out-String) -match '미리보기만 했어요')) { Write-Host '미리보기 끝 줄이 없어요'; exit 1 }
          if (Test-Path "$env:LOCALAPPDATA\gyeot\bin") { Write-Host '미리보기가 설치했어요'; exit 1 }
      - name: 설치·점검(5.1, HTTPS, 기본 폴더)
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP\gyeot-boot\bootstrap.ps1" -Tag $env:GITHUB_REF_NAME -ApplyClaudeHooks -RegisterStartup -Install 6>&1 | Tee-Object -Variable out | Out-Host
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $t = $out | Out-String
          foreach ($want in @('SHA-256 일치', '점검 통과', '내 곁 데몬', '설치·점검을 마쳤어요')) { if ($t -notmatch [regex]::Escape($want)) { Write-Host "출력에 '$want' 가 없어요"; exit 1 } }
      - name: 업데이트·점검(7, gh 로그인 → 출처 증명 확인)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & "$env:LOCALAPPDATA\gyeot\scripts\bootstrap.ps1" -Tag $env:GITHUB_REF_NAME -ApplyClaudeHooks -RegisterStartup -Install 6>&1 | Tee-Object -Variable out | Out-Host
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $t = $out | Out-String
          foreach ($want in @('출처 증명 일치', '점검 통과', '내 곁 데몬')) { if ($t -notmatch [regex]::Escape($want)) { Write-Host "출력에 '$want' 가 없어요"; exit 1 } }
          $s = Get-Content -Raw "$env:USERPROFILE\.claude\settings.json" | ConvertFrom-Json
          $n = @($s.hooks.Stop | ForEach-Object { $_.hooks } | Where-Object { $_.command -match 'gyeot-hook' }).Count
          if ($n -ne 1) { Write-Host "업데이트 뒤 Stop 의 곁 훅이 $n 개예요(1이어야)"; exit 1 }
      - name: 점검만(설치 폴더의 doctor)
        shell: powershell
        run: |
          & "$env:LOCALAPPDATA\gyeot\scripts\doctor.ps1"
          exit $LASTEXITCODE
      - name: 지우기(훅·시작 등록 포함)
        shell: powershell
        run: |
          & "$env:LOCALAPPDATA\gyeot\scripts\uninstall.ps1" -RemoveClaudeHooks
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Get-ScheduledTask -TaskName gyeot-daemon -ErrorAction SilentlyContinue) { Write-Host '작업 스케줄러 등록이 남았어요'; exit 1 }
          if (Test-Path "$env:LOCALAPPDATA\gyeot\bin") { Write-Host 'bin 이 남았어요'; exit 1 }
