[package]
name = "gyeot-hook"
description = "곁 훅 심: 훅 입력을 데몬에 넘긴다(stdout 없음, 늘 exit 0)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "gyeot-hook"
path = "src/main.rs"

[dependencies]
gyeot-core = { workspace = true }
dirs = { workspace = true }
getrandom = { workspace = true }
# 데몬 확인(계약 §13.1). 서버와 같은 판(hmac 0.12 = digest 0.10 = sha2 0.10).
hmac = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ureq = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
gyeot-server = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
